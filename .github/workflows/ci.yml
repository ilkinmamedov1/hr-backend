name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hr_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hr_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/hr_erp
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ENVIRONMENT: development
      AUTO_SEED: "true"
      SEED_DEMO: "true"
      ENABLE_DOCS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t hr-erp:ci .
      - name: Validate compose configuration
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_LONG_RANDOM_PASSWORD/ci-db-password/' .env
          sed -i 's/REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS/0123456789abcdef0123456789abcdef/' .env
          sed -i 's/REPLACE_WITH_STRONG_ADMIN_PASSWORD/ci-admin-password/' .env
          docker compose config >/dev/null
