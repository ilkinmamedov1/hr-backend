services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  api:
    environment:
      ENVIRONMENT: development
      SEED_DEMO: "true"
      ENABLE_DOCS: "true"
    volumes:
      - ./app:/code/app
      - ./scripts:/code/scripts
      - ./tests:/code/tests

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
